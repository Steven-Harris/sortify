name: Security Scan

on:
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scans
    - cron: '0 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Run Trivy filesystem scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Set up Go for Gosec
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        check-latest: true
        cache-dependency-path: backend/go.sum

    - name: Run Gosec Security Scanner
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        cd backend
        echo "Running gosec in directory: $(pwd)"
        gosec -fmt sarif -out ../gosec-results.sarif ./...
        cd ..
        echo "Contents of current directory:"
        ls -la gosec-results.sarif || echo "gosec-results.sarif not found"

    - name: Upload Gosec scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'gosec-results.sarif'

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Run Trivy dependency scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'HIGH,CRITICAL'

  docker-image-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image for security scanning
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: sortify:security-scan

    - name: Run comprehensive Trivy scan on Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'sortify:security-scan'
        format: 'sarif'
        output: 'trivy-docker-results.sarif'
        severity: 'MEDIUM,HIGH,CRITICAL'

    - name: Upload Docker image scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-docker-results.sarif'

    - name: Run Trivy config scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'  # Don't fail on config issues, just report
