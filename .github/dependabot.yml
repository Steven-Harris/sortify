version: 2
updates:
  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Steven-Harris"
    assignees:
      - "Steven-Harris"
    commit-message:
      prefix: "deps(go)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    groups:
      major-updates:
        update-types:
          - major
      minor-patch-updates:
        update-types:
          - minor
          - patch

  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Steven-Harris"
    assignees:
      - "Steven-Harris"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      major-updates:
        update-types:
          - major
      minor-patch-updates:
        update-types:
          - minor
          - patch

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 3
    reviewers:
      - "Steven-Harris"
    assignees:
      - "Steven-Harris"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    groups:
      major-updates:
        update-types:
          - major
      minor-patch-updates:
        update-types:
          - minor
          - patch  

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 3
    reviewers:
      - "Steven-Harris"
    assignees:
      - "Steven-Harris"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      major-updates:
        update-types:
          - major
      minor-patch-updates:
        update-types:
          - minor
          - patch
