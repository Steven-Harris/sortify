services:
  sortify:
    image: steharris/sortify:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sortify
    restart: unless-stopped
    # Set custom user ID and group ID - change these values as needed
    user: "${PUID:-1001}:${PGID:-1001}"
    ports:
      - "8080:8080"
    environment:
      - MEDIA_PATH=/media
      - TEMP_PATH=/tmp
      # Uncomment and configure these as needed:
      # - LOG_LEVEL=info
      # - PORT=8080
      # For development with separate frontend server:
      # - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175
      # For production reverse proxy from different domain:
      # - CORS_ORIGINS=https://yourdomain.com
    volumes:
      - ./media:/media:rw
      - ./media/temp:/tmp:rw
