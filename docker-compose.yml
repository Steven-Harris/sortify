services:
  sortify:
    image: steharris/sortify:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sortify
    restart: unless-stopped
    user: 1001:1001
    ports:
      - "8080:8080"
    environment:
      - MEDIA_PATH=/media
      - TEMP_PATH=/tmp
      # Uncomment and configure these as needed:
      # - LOG_LEVEL=info
      # - CORS_ORIGINS=*
      # - PORT=8080
    volumes:
      - ./media:/media:rw
      - ./media/temp:/tmp:rw
