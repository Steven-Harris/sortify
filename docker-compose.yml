services:
  sortify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sortify
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./media:/media:rw
    environment:
      - PORT=8080
      - MEDIA_PATH=/media
      - CORS_ORIGINS=http://localhost:8080
